services:
  sms-tools-web:
    build: .
    container_name: sms-tools-web
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      API_URL: ${API_URL}
      API_TOKEN: ${API_TOKEN}
      SMS_GROUP_ID: ${SMS_GROUP_ID}
      SMS_GROUP_USER: ${SMS_GROUP_USER}
      SMS_GROUP_PASS: ${SMS_GROUP_PASS}
      SMS_GROUP_PHONE: ${SMS_GROUP_PHONE}
    volumes:
      - ./src:/var/www/html
      - ./src/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./db_init.php:/usr/local/bin/db_init.php:ro
    command: ["sh", "-c", "php /usr/local/bin/db_init.php && apache2-foreground"]
    depends_on:
      - sms-tools-db
    networks:
      - sms-net

  sms-tools-db:
    image: mariadb:10.11
    container_name: sms-tools-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - ./db-data:/var/lib/mysql
    networks:
      - sms-net

networks:
  sms-net:
    driver: bridge
