services:
  sms-tools-web:
    # Pull pre-built image from GitHub Container Registry
    image: ghcr.io/lassehschmidt/smstools:latest
    container_name: sms-tools-web
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      # Database connection settings
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # GatewayAPI credentials
      API_URL: ${API_URL}
      API_TOKEN: ${API_TOKEN}
      # Default SMS group user synced to SMSGroups table on startup
      SMS_GROUP_ID: ${SMS_GROUP_ID}
      SMS_GROUP_USER: ${SMS_GROUP_USER}
      SMS_GROUP_PASS: ${SMS_GROUP_PASS}
      SMS_GROUP_PHONE: ${SMS_GROUP_PHONE}
    depends_on:
      - sms-tools-db
    networks:
      - sms-net

  sms-tools-db:
    image: mariadb:10.11
    container_name: sms-tools-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      # Persist database files on the host
      - ./db-data:/var/lib/mysql
    networks:
      - sms-net

networks:
  sms-net:
    driver: bridge
